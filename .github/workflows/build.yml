name: Build

on:
  pull_request:
  workflow_dispatch:
# Cancel superseded PR checks; keep every non-PR invocation independent.
concurrency:
  group: build.yml-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v1
        with:
          node-version: 12
      - uses: actions/setup-go@v2
        with:
          go-version: '^1.17.3'

      - run: yarn
      - run: yarn test
      - run: go install cuelang.org/go/cmd/cue@v0.4.0
      - run: PATH=$PATH:~/go/bin ./validate.sh
